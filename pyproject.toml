[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapesplit"
version = "0.1.0"
description = "Local-first VHS and home-video intelligence pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "TapeSplit contributors" }
]
dependencies = []

[project.optional-dependencies]
twelvelabs = ["twelvelabs>=1.0.0"]
local-ai = [
  "openai-whisper",
  "sentence-transformers",
  "sqlite-vec",
]
vision = [
  "opencv-python",
]

[project.scripts]
tapesplit = "tapesplit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
