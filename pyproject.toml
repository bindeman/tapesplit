[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapesplit"
version = "0.1.0"
description = "Local-first VHS and home-video intelligence pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "TapeSplit contributors" }
]
dependencies = []

[project.optional-dependencies]
twelvelabs = ["twelvelabs>=1.0.0"]
local-ai = [
  "openai-whisper",
  "sentence-transformers",
  "sqlite-vec",
]
vision = [
  "opencv-python",
]
macos = [
  "pyobjc-framework-Vision",
  "pyobjc-framework-Quartz",
]
face-ai = [
  "insightface>=1.0.1",
  "onnxruntime>=1.27.0",
  # cvlface-kprpe backend (bundled remote code needs these at import time)
  "omegaconf>=2.3",
  "timm>=1.0",
  "easydict>=1.10",
]
visual-ai = [
  "pillow>=10.1",
  "sentence-transformers",
]
speaker-ai = [
  "pyannote.audio",
  "speechbrain",
]

[project.scripts]
tapesplit = "tapesplit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
