name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. TapeSplit is local-first and tries to make a family archive reviewable with as little human effort as possible, so proposals that cut review work, keep corrections durable, or let a provider be swapped are especially welcome.

        Issues are public. Describe your situation with made-up names and places, and do not paste transcripts, faces, or frames from private tapes.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you are trying to do with your tapes or archive and where TapeSplit gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like TapeSplit to do?
      description: The behavior you have in mind. A sketch of the command, UI flow, or output is plenty.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use today, or other designs you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipeline / tapesplit auto
        - Review UI
        - Search
        - People, faces, and speakers
        - Dates, places, and events
        - Providers and local models
        - Export and metadata
        - Documentation
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would be willing to help build this.
